# Agent CODEX_HOME — base config.
#
# Source of truth: ~/dotfiles/codex/. Deployed to ~/.codex-agent/ by bootstrap.sh
# step 7.7. Never edit the deployed copy — bootstrap overwrites it.
#
# Why this home exists. The interactive home (~/.codex) sets
# sandbox_mode = "workspace-write", so anything invoking Codex without naming a
# sandbox writes wherever it happens to be standing. Agent-initiated Codex gets
# this home instead, where the default is read-only and a mode has to be asked
# for by name.
#
# This file deliberately declares no plugins, no MCP servers and no marketplaces.
# The interactive home enables browser, chrome and computer-use; those reach past
# the sandbox, and an agent-initiated Codex has no business holding them.
#
# Profiles layer on top of this file: `codex -p <name>` loads <name>.config.toml
# from this directory (verified against codex-cli 0.147.0-alpha.1.2).

# model and reasoning effort mirror ~/.codex/config.toml on purpose. The only
# thing that should differ between the interactive home and this one is the
# fence — left unset, model_reasoning_effort lands on "none" and the agent path
# would quietly be the weaker of the two.
model = "gpt-5.6-sol"
model_reasoning_effort = "medium"

sandbox_mode = "read-only"
approval_policy = "never"

# THE SANDBOX DOES NOT COVER WEB SEARCH, and web search is on by default.
# Measured 2026-08-10 (codex-cli 0.147.0-alpha.1.2): from an EMPTY directory,
# under sandbox_mode = "read-only" with sandbox_workspace_write.network_access
# = false, Codex ran a web search and returned a live headline. The sandbox
# governs model-generated SHELL commands; the search tool is called by the
# Codex process, which is not inside that sandbox. Turning the network off
# closes one door and leaves this one open.
#
# The key is a top-level STRING, and the two obvious spellings both fail:
# `[tools] web_search = false` is accepted and silently ignored (search still
# ran), and top-level `web_search = false` is a hard type error. Only
# `web_search = "disabled"` closes it — 0 search events, the model reports it
# has no search tool. Evidence: codex-bridge
# evidence/bridge-v2-websearch-b4-2026-08-10/.
#
# A profile that genuinely needs search overrides this in its own file, which
# is a visible, committed edit — the same rule the network switch follows.
web_search = "disabled"

# ── the host skill catalog never belonged inside this fence ───────────────────
# Measured 2026-09-11: the catalog reached EVERY fenced run from the first
# session ever made (2026-08-09) onward — 43 skills, ~3,600 tokens, each one an
# absolute path under $HOME/.agents/skills -> ~/dotfiles/skills, every one of
# them denied by this fence. Codex is told it MUST use a skill matching the
# task, so it announced one, failed to open it, and improvised. On 28% of real
# runs. Evidence: context/ask-codex-usage-2026-09-11/REPORT.md in codex-bridge.
#
# The skills root is joined from home_dir(), NOT from CODEX_HOME, so repointing
# CODEX_HOME does not close this. `--ignore-user-config` does not either: it
# installs an EMPTY user layer, so the same match arm still pushes both roots.
#
# 🛑 Unknown keys inside [skills] are DROPPED SILENTLY — SkillsConfig carries
# #[schemars(deny_unknown_fields)], which is schema-only with no serde
# equivalent. A misspelling parses and vanishes, exactly like
# `[tools] web_search = false`, which read like a fence and was not one. The
# --live differential probe in scripts/test_ask_codex.sh misspells each key on
# purpose for that reason.
#
# Restated here rather than inherited, because the base config every profile extends is a unit the wrapper names
# and must be legible on its own — and must not soften if the base config is
# ever loosened.
[skills]
include_instructions = false

[skills.bundled]
enabled = false
