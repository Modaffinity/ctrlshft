# depths.toml — what `ask-codex --depth <word>` means. Deployed to
# ~/.codex-agent/ by bootstrap.sh step 7.7 beside the profiles; the wrapper reads
# the deployed copy.
#
# NOT a fence. Model and effort decide how hard Codex thinks and how much quota a
# run spends, never what it can reach: that is the profile and the empty cwd.
#
# Every model here must be LISTED in ~/.codex-agent/models_cache.json and every
# effort must be one that model supports, or every run refuses with exit 4 naming
# the listed slugs — a rename is caught, never silently substituted. `normal` is
# the default and matches config.toml's model and model_reasoning_effort, which
# non-wrapper callers such as the MCP path still use.

[quick]
model = "gpt-5.6-sol"
effort = "low"

[normal]
model = "gpt-5.6-sol"
effort = "medium"

[deep]
model = "gpt-5.6-sol"
effort = "high"
